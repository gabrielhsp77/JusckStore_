<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jusk Store</title>

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="css/stylelogin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <a class="brand" href="#">
                <img src="img/logo.png" alt="Logo da Jusk Store">
            </a>

            <div class="nav-help">
                <div class="social-links">
                    <a
                        href="https://www.instagram.com/juskstore_?igsh=d3M5b2FzZGtkMGtx"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Instagram da Jusk Store"
                    >
                        <img src="img/instagram.png" alt="">
                    </a>

                    <a
                        href="https://wa.me/5516997616509"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="WhatsApp da Jusk Store"
                    >
                        <img src="img/whatsapp.png" alt="">
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="login-page">
        <section class="store-info">
            <img
                class="store-logo"
                src="img/logo.png"
                alt="Logo da Jusk Store"
            >

            <h2>JuskStore</h2>
            <p>vista sua melhor<br>versão</p>
        </section>

        <section class="login-box">
            <div class="user-icon">
                <img
                    src="img/Icone-pessoa-box.png"
                    alt="Ícone de usuário"
                >
            </div>

            <h1>Entrar na sua conta</h1>

            <form>
                <div class="input-box">
                    <img class="icon-usuario" src="img/usuario.png" alt="">

                    <input
                        type="text"
                        name="login"
                        placeholder="Digite seu email ou telefone"
                        autocomplete="username"
                        aria-label="Email ou Telefone"
                    >
                </div>

                <div class="input-box">
                    <img class="icon-senha" src="img/senha.png" alt="">

                    <input
                        type="password"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        aria-label="Senha"
                     >
                </div>

                <button class="btn" type="submit">Entrar</button>

                <div class="forgot-password">
                    <a href="#">Esqueceu sua senha?</a>
                </div>

                
            </form>

            <div class="cadastro">
                <span>Ainda não possui uma conta?</span>
                <a href="#">Criar conta <span class="seta">→</span></a>
            </div>

        </section>
    </main>

    <footer class="footer">
        <img src="img/escudo.png" alt="Segurança">
        <span>JuskStore © 2026 - Todos os direitos reservados.</span>
    </footer>

</body>
</html>
